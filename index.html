<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>REKAPITULASI LKBB ARTEMIS CHAPTER 2</title>
<style>
:root{--navy:#0b2447;--navy2:#19376d;--gold:#c9a227;--bg:#f4f6fb;--card:#fff;--tx:#1b2333;--mu:#667;--bd:#dde2ee;--th:#0b2447;--thx:#fff;--row:#f8f9fd;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1222;--card:#121c33;--tx:#e8ecf6;--mu:#9aa6c2;--bd:#26335a;--th:#19376d;--row:#16223d}}
:root[data-theme="dark"]{--bg:#0a1222;--card:#121c33;--tx:#e8ecf6;--mu:#9aa6c2;--bd:#26335a;--th:#19376d;--row:#16223d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--tx)}
button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:9px 14px;background:var(--navy);color:#fff}
button.g{background:var(--gold);color:#1b1500;font-weight:600}button.o{background:transparent;color:var(--tx);border:1px solid var(--bd)}button.r{background:#b3261e}
input{font:inherit;padding:9px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);width:100%}
header.top{background:var(--navy);color:#fff;padding:12px 18px;display:flex;align-items:center;gap:12px;border-bottom:3px solid var(--gold)}
.logo{width:42px;height:42px;border-radius:50%;background:var(--gold);color:var(--navy);display:grid;place-items:center;font-weight:800;flex:none}
header.top .sp{flex:1}header.top b{display:block}header.top small{opacity:.75}
.land{min-height:80vh;display:grid;place-items:center;padding:24px;text-align:center}.land>div{width:100%;max-width:440px;margin:0 auto}
.box{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:26px;width:100%;max-width:400px;margin:20px auto 0;text-align:left;box-shadow:0 8px 30px #0b244722}
.tabs{display:flex;gap:6px;margin-bottom:14px}.tabs button{flex:1;background:var(--row);color:var(--tx);border:1px solid var(--bd)}.tabs button.on{background:var(--navy);color:#fff}
.box label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}.err{color:#b3261e;font-size:13px;min-height:18px;margin-top:8px}
h1{color:var(--navy);margin:14px 0 6px;font-size:clamp(22px,4vw,32px)}@media (prefers-color-scheme:dark){h1{color:var(--gold)}}
.mu{color:var(--mu)}
.layout{display:flex;min-height:calc(100vh - 70px)}
aside{width:210px;background:var(--navy2);padding:14px 10px;flex:none}aside button{display:block;width:100%;text-align:left;background:transparent;margin-bottom:4px;color:#dfe6f7}aside button.on{background:var(--gold);color:#1b1500;font-weight:600}
main{flex:1;padding:18px;min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin:14px 0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px}
.lv{cursor:pointer;text-align:center;border-top:4px solid var(--gold);padding:30px 10px}.lv:hover{transform:translateY(-3px);box-shadow:0 8px 20px #0b244733}.lv b{font-size:28px;color:var(--navy)}@media (prefers-color-scheme:dark){.lv b{color:var(--gold)}}
.stat b{font-size:26px;display:block;color:var(--navy)}@media (prefers-color-scheme:dark){.stat b{color:var(--gold)}}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0;align-items:center}.bar input{max-width:240px}
.tw{overflow-x:auto;border:1px solid var(--bd);border-radius:12px;background:var(--card);max-height:70vh}
table{border-collapse:collapse;width:100%;min-width:760px}th{background:var(--th);color:var(--thx);position:sticky;top:0;padding:10px 8px;font-size:13px;white-space:nowrap;user-select:none}
th.s{cursor:pointer}th.s:hover{background:var(--gold);color:#1b1500}td{padding:7px 8px;border-top:1px solid var(--bd);text-align:center}tr:nth-child(even) td{background:var(--row)}
td.n{text-align:left}th.n{text-align:left}td input{padding:6px;text-align:center;min-width:62px}td input.nm{text-align:left;min-width:160px}
.bg{display:inline-grid;place-items:center;min-width:28px;height:28px;border-radius:14px;font-weight:700;background:var(--bd);color:var(--tx)}
.b1{background:#d4af37;color:#2b2100}.b2{background:#c0c0c0;color:#222}.b3{background:#cd7f32;color:#fff}
.calc{font-weight:700}.log li{margin:5px 0;font-size:14px}.log{padding-left:18px}
.chart div{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13px}.chart i{display:block;height:14px;background:var(--gold);border-radius:4px}
.hide{display:none!important}
@media (max-width:720px){.layout{flex-direction:column}aside{width:100%;display:flex;overflow-x:auto;gap:4px}aside button{white-space:nowrap;width:auto;margin:0}main{padding:12px}}
@media print{header.top button,aside,.bar,.noprint,td:last-child.act,th.act{display:none!important}.layout{display:block}body{background:#fff;color:#000}.tw{max-height:none;border:0}th{background:#0b2447!important;color:#fff!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}}
img.logo{background:none!important;object-fit:contain;border-radius:50%}header.top .logo{width:48px;height:48px}</style></head><body>

const LV=["SD","SMP","SMA","PURNA"],KEY="rekap_db_v1";
let db,role=null,lvl=null,view="dash",sort=null,q="";
try{role=sessionStorage.getItem("role")}catch(e){}
function load(){try{db=JSON.parse(localStorage.getItem(KEY))}catch(e){}
 if(!db||!db.SD)db={SD:[],SMP:[],SMA:[],PURNA:[],log:[]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}}
load();
const USERS={panitia:{u:"panitia",p:"panitia123"},peserta:{u:"peserta",p:"peserta123"}};
const num=v=>{v=parseFloat(String(v).replace(",","."));return isNaN(v)?0:Math.max(0,v)};
const F=n=>Math.round(n*100)/100;
const calc=r=>{r.ju=F(r.pbb+r.varfor+r.danton);r.um=F(r.ju+r.kostum);return r};
const def=(a,b)=>b.ju-a.ju||b.pbb-a.pbb||b.varfor-a.varfor||b.danton-a.danton||b.kostum-a.kostum;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function ranked(l){const a=db[l].map(r=>calc(r)).sort(def);a.forEach((r,i)=>r._rk=i+1);return a}
function rows(l){let a=ranked(l);
 if(q)a=a.filter(r=>r.nama.toLowerCase().includes(q.toLowerCase()));
 if(sort){const d=sort.dir==="desc"?1:-1;a=[...a].sort((x,y)=>(d*(y[sort.k]-x[sort.k]))||def(x,y))}return a}
function logit(t){db.log.unshift({t,w:new Date().toLocaleString("id-ID")});db.log=db.log.slice(0,15)}
const badge=n=>`<span class="bg ${n<=3?"b"+n:""}">${n}</span>`;
const COLS=[["pbb","PBB"],["varfor","VARFOR"],["danton","DANTON"],["ju","JUARA UTAMA"],["kostum","KOSTUM"],["um","JUARA UMUM"]];
const ALLC=[["pbb","PBB"],["varfor","VARFOR"],["danton","DANTON"],["ju","JUARA UTAMA"],["kostum","KOSTUM"],["makeup","MAKEUP"],["um","JUARA UMUM"]];
function head(admin){return `<tr><th>No</th><th class="n">Nama Sekolah</th>`+ALLC.map(([k,t])=>{
 const on=sort&&sort.k===k;return `<th class="s" onclick="doSort('${k}')">${t} ${on?(sort.dir==="desc"?"▼":"▲"):"↕"}</th>`}).join("")+(admin?`<th class="act">Aksi</th>`:"")+`</tr>`}
function doSort(k){sort=sort&&sort.k===k?(sort.dir==="desc"?{k,dir:"asc"}:{k,dir:"desc"}):{k,dir:"desc"};draw()}
function login(){const t=document.querySelector(".tabs .on").dataset.r,u=document.getElementById("u").value.trim(),p=document.getElementById("p").value;
 const x=USERS[t];if(u===x.u&&p===x.p){role=t;try{sessionStorage.setItem("role",t)}catch(e){}lvl=null;view="dash";draw()}else document.getElementById("err").textContent="Username atau password salah."}
function logout(){role=null;try{sessionStorage.removeItem("role")}catch(e){}draw()}
function pick(t,b){document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("on"));b.classList.add("on")}
function shell(inner){return `<header class="top"><img class="logo" alt="Logo LKBB Artemis" src="${LOGO}"><div><b>REKAPITULASI LKBB ARTEMIS CHAPTER 2</b><small>${role==="panitia"?"Panel Panitia":"Halaman Peserta"}</small></div><div class="sp"></div><button class="g" onclick="logout()">Keluar</button></header>`+inner}
function landing(){return `<header class="top"><img class="logo" alt="Logo LKBB Artemis" src="${LOGO}"><div><b>REKAPITULASI LKBB ARTEMIS CHAPTER 2</b><small>Perlombaan SD · SMP · SMA · PURNA</small></div></header>
<div class="land"><div><img class="logo" alt="Logo LKBB Artemis" src="${LOGO}" style="width:130px;height:130px;margin:auto;display:block"><h1>REKAPITULASI LKBB ARTEMIS CHAPTER 2</h1>
<p class="mu">Lihat hasil penilaian secara transparan, dengan peringkat yang dihitung otomatis.</p>
<div class="box"><div class="tabs"><button class="on" data-r="peserta" onclick="pick(0,this)">Login Peserta</button><button data-r="panitia" onclick="pick(0,this)">Login Panitia</button></div>
<label>Username</label><input id="u" autocomplete="username"><label>Password</label><input id="p" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()">
<div class="err" id="err"></div><button class="g" style="width:100%" onclick="login()">Masuk</button>
<p class="mu" style="font-size:12px;margin:12px 0 0">Demo: panitia / panitia123 · peserta / peserta123</p></div></div></div>`}
function levelCards(admin){return `<h2>Pilih Tingkatan</h2><div class="grid">`+LV.map(l=>`<div class="card lv" onclick="go('${l}')"><b>${l}</b><div class="mu">${db[l].length} peserta</div></div>`).join("")+`</div>`}
function go(l){lvl=l;view="lvl";sort=null;q="";draw()}
function tools(admin){const a=ranked(lvl);const top=a[0];
 return `<div class="grid noprint"><div class="card stat"><span class="mu">Peserta</span><b>${a.length}</b></div><div class="card stat"><span class="mu">Nilai tertinggi (Juara Umum)</span><b>${a.length?Math.max(...a.map(r=>r.um)):0}</b></div><div class="card stat"><span class="mu">Juara Utama</span><b style="font-size:18px">${top?esc(top.nama):"-"}</b></div><div class="card stat"><span class="mu">Juara Umum</span><b style="font-size:18px">${a.length?esc([...a].sort((x,y)=>y.um-x.um||def(x,y))[0].nama):"-"}</b></div></div>`}
function table(admin){const a=rows(lvl);
 return `<div class="tw"><table><thead>${head(admin)}</thead><tbody>`+(a.length?a.map((r,i)=>admin?
 `<tr><td>${badge(r._rk)}</td><td class="n"><input class="nm" value="${esc(r.nama)}" onchange="upd('${r.id}','nama',this.value)"></td>`+
 ["pbb","varfor","danton"].map(k=>`<td><input type="number" min="0" step="any" value="${r[k]}" onchange="upd('${r.id}','${k}',this.value)"></td>`).join("")+
 `<td class="calc">${r.ju}</td><td><input type="number" min="0" step="any" value="${r.kostum}" onchange="upd('${r.id}','kostum',this.value)"></td><td><input type="number" min="0" step="any" value="${r.makeup}" onchange="upd('${r.id}','makeup',this.value)"></td><td class="calc">${r.um}</td><td class="act"><button class="r" onclick="del('${r.id}')">Hapus</button></td></tr>`
 :`<tr><td>${badge(r._rk)}</td><td class="n">${esc(r.nama)}</td><td>${r.pbb}</td><td>${r.varfor}</td><td>${r.danton}</td><td class="calc">${r.ju}</td><td>${r.kostum}</td><td>${r.makeup}</td><td class="calc">${r.um}</td></tr>`).join(""):`<tr><td colspan="10" class="mu" style="padding:24px">Belum ada data.</td></tr>`)+`</tbody></table></div>
 <p class="mu noprint" style="font-size:12px">Nomor badge = peringkat default (Juara Utama; seri: PBB → VARFOR → DANTON → KOSTUM). MAKEUP hanya dicatat, tidak dihitung.</p>`}
function levelPage(admin){return `<div class="bar noprint"><button class="o" onclick="view='${admin?"lvls":"x"}';lvl=null;draw()">← Pilihan tingkatan</button><input placeholder="Cari nama sekolah..." value="${esc(q)}" oninput="q=this.value;redraw()" id="srch"><button class="o" onclick="sort=null;draw()">Reset Urutan</button>
 ${admin?`<button class="g" onclick="add()">+ Tambah Peserta</button><button class="o" onclick="copyX()">Salin (Excel)</button><button class="r" onclick="resetL()">Reset Data</button>`:""}<button class="o" onclick="window.print()">Cetak</button><button class="o" onclick="window.print()">Simpan PDF</button></div>
 <h2 style="margin:6px 0">Tingkat ${lvl}</h2>${tools(admin)}<div id="tb">${table(admin)}</div>`}
function redraw(){const t=document.getElementById("tb");if(t)t.innerHTML=table(role==="panitia")}
function ask(msg,input){return new Promise(res=>{const d=document.createElement("div");d.style.cssText="position:fixed;inset:0;background:#0008;display:grid;place-items:center;z-index:99;padding:16px";d.innerHTML=`<div class="box" style="margin:0"><p>${esc(msg)}</p>${input?'<input id="aski">':''}<div style="display:flex;gap:8px;margin-top:12px"><button class="g" id="ok">OK</button><button class="o" id="no">Batal</button></div></div>`;document.body.appendChild(d);const i=d.querySelector("#aski");if(i)i.focus();const done=v=>{d.remove();res(v)};d.querySelector("#ok").onclick=()=>done(input?i.value:true);d.querySelector("#no").onclick=()=>done(input?null:false);if(i)i.onkeydown=e=>{if(e.key==="Enter")done(i.value)}})}
window.alert=m=>{ask(String(m))};
async function add(){const n=await ask("Nama sekolah / peserta:",true);if(!n||!n.trim())return;db[lvl].push({id:"p"+Date.now()+Math.random().toString(36).slice(2,5),nama:n.trim(),pbb:0,varfor:0,danton:0,kostum:0,makeup:0,ju:0,um:0});logit(`Menambah ${n.trim()} (${lvl})`);save();draw()}
function upd(id,k,v){const r=db[lvl].find(x=>x.id===id);if(!r)return;r[k]=k==="nama"?(v.trim()||r.nama):num(v);calc(r);logit(`Mengubah ${k.toUpperCase()} ${r.nama} (${lvl})`);save();draw()}
async function del(id){const r=db[lvl].find(x=>x.id===id);if(r&&await ask(`Hapus ${r.nama}?`)){db[lvl]=db[lvl].filter(x=>x.id!==id);logit(`Menghapus ${r.nama} (${lvl})`);save();draw()}}
async function resetL(){if(await ask(`Reset SEMUA data tingkat ${lvl}? Ketik RESET untuk melanjutkan:`,true)==="RESET"){db[lvl]=[];logit(`Reset data ${lvl}`);save();draw()}}
function copyX(){const t=["No\tNama\tPBB\tVARFOR\tDANTON\tJUARA UTAMA\tKOSTUM\tMAKEUP\tJUARA UMUM"].concat(ranked(lvl).map(r=>[r._rk,r.nama,r.pbb,r.varfor,r.danton,r.ju,r.kostum,r.makeup,r.um].join("\t"))).join("\n");
 try{navigator.clipboard.writeText(t).then(()=>alert("Tersalin. Tempel (Ctrl+V) ke Excel."),()=>alert("Gagal menyalin."))}catch(e){alert("Gagal menyalin.")}}
function dash(){const all=LV.flatMap(l=>db[l]);
 const mx=Math.max(1,...LV.map(l=>db[l].length));
 return `<h2>Dashboard</h2><div class="grid">`+LV.map(l=>`<div class="card stat"><span class="mu">Sekolah ${l}</span><b>${db[l].length}</b></div>`).join("")+`<div class="card stat"><span class="mu">Total peserta</span><b>${all.length}</b></div></div>
 <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr))"><div class="card"><b>Nilai tertinggi & peringkat 1</b><ul class="log">`+LV.map(l=>{const a=ranked(l);return `<li><b>${l}</b>: ${a.length?`${esc(a[0].nama)} (Utama ${a[0].ju}) · tertinggi Umum ${Math.max(...a.map(r=>r.um))}`:"-"}</li>`}).join("")+`</ul></div>
 <div class="card"><b>Jumlah per tingkatan</b><div class="chart">`+LV.map(l=>`<div><span style="width:52px">${l}</span><i style="width:${db[l].length/mx*100}%;min-width:3px"></i>${db[l].length}</div>`).join("")+`</div></div>
 <div class="card"><b>Aktivitas terbaru</b><ul class="log">${db.log.length?db.log.slice(0,8).map(x=>`<li>${esc(x.t)}<br><small class="mu">${x.w}</small></li>`).join(""):"<li class='mu'>Belum ada aktivitas.</li>"}</ul></div></div>`}
function draw(){const app=document.getElementById("app");load();
 if(!role){app.innerHTML=landing();return}
